<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #F3F1EA; font-family: "Instrument Serif", serif; color: #121212; }
  .logo { position: absolute; left: 64px; top: 56px; width: 190px; aspect-ratio: 936/265; background: #121212;
    -webkit-mask: url(../../mockups/shared/brand/lockup.png) center/contain no-repeat; mask: url(../../mockups/shared/brand/lockup.png) center/contain no-repeat; }
  .meta { position: absolute; left: 64px; top: 136px; font: 500 15px "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: #67645C; }
  h1 { position: absolute; left: 60px; top: 170px; margin: 0; font-weight: 400; font-size: 84px; line-height: .95; letter-spacing: -.02em; width: 520px; }
  h1 mark { background: linear-gradient(transparent 60%, #FBE421 60% 92%, transparent 92%); font-style: italic; color: inherit; }
  .foot { position: absolute; left: 64px; bottom: 52px; font: 500 15px "JetBrains Mono", monospace; letter-spacing: .06em; color: #67645C; text-transform: uppercase; }
  .stack { position: absolute; right: -40px; top: 40px; width: 640px; height: 560px; }
  .card { position: absolute; width: 470px; aspect-ratio: 16/10; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 60px -20px rgba(0,0,0,.45); border: 1px solid rgba(0,0,0,.12); background: #000; }
  .card img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .c1 { left: 0; top: 30px; transform: rotate(-7deg); }
  .c2 { left: 90px; top: 175px; transform: rotate(-1.5deg); }
  .c3 { left: 160px; top: 320px; transform: rotate(4deg); }
</style></head>
<body>
  <i class="logo"></i>
  <div class="meta">Laxman Chowk · Dehradun · Since 2009</div>
  <h1>Three ways to tell<br><mark>A Complete Fitness Academy.</mark></h1>
  <div class="foot">Website design directions · for review</div>
  <div class="stack">
    <div class="card c1"><img src="../../mockups/shared/previews/b.jpg"></div>
    <div class="card c2"><img src="../../mockups/shared/previews/c.jpg"></div>
    <div class="card c3"><img src="../../mockups/shared/previews/a.jpg"></div>
  </div>
</body></html>
