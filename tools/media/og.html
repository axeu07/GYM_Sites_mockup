<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&family=Noto+Serif+JP:wght@900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0A0A0A; color: #F2EEE6; font-family: "Anton", sans-serif; }
  body::before { content: ""; position: absolute; inset: 0; opacity: .9;

  .logo { position: absolute; left: 64px; top: 56px; width: 230px; aspect-ratio: 936/265; background: #F2EEE6;
    -webkit-mask: url(../../mockups/shared/brand/lockup.png) center/contain no-repeat; mask: url(../../mockups/shared/brand/lockup.png) center/contain no-repeat; }
  .meta { position: absolute; left: 66px; top: 150px; font: 500 15px "JetBrains Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: #A8A29A; }
  h1 { position: absolute; left: 62px; top: 186px; margin: 0; font-weight: 400; font-size: 120px; line-height: .92; text-transform: uppercase; }
  h1 b { font-weight: 400; color: #FF5A1F; text-shadow: 0 0 40px rgba(255, 90, 31, .45); }
  .jp { position: absolute; left: 520px; top: 196px; writing-mode: vertical-rl; font: 900 34px "Noto Serif JP", serif; letter-spacing: .3em; color: #D7261E; }
  .sub { position: absolute; left: 66px; top: 440px; font: 500 22px "JetBrains Mono", monospace; color: #F2EEE6; letter-spacing: .02em; }
  .foot { position: absolute; left: 66px; bottom: 52px; font: 500 15px "JetBrains Mono", monospace; letter-spacing: .08em; color: #A8A29A; text-transform: uppercase; }
  .stack { position: absolute; right: 40px; top: 44px; width: 560px; height: 560px; }
  .card { position: absolute; width: 250px; aspect-ratio: 4/5; border-radius: 16px; overflow: hidden; box-shadow: 0 30px 60px -20px rgba(0,0,0,.8); border: 1px solid rgba(242,238,230,.18); background: #111; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .c1 { left: 10px; top: 60px; transform: rotate(-6deg); }
  .c2 { left: 170px; top: 20px; transform: rotate(2deg); z-index: 2; border-color: #FF5A1F; }
  .c3 { left: 310px; top: 110px; transform: rotate(7deg); }
</style></head>
<body>
  <i class="logo"></i>

  <h1>Find your<br><b>Ikigai.</b></h1>
  <div class="jp">生き甲斐</div>
  <div class="sub">Find your reason to move.</div>
  <div class="foot">Website design directions · for review</div>
  <div class="stack">
    <div class="card c1"><img src="../../mockups/shared/img/boxing-mural-sm.jpg"></div>
    <div class="card c2"><img src="../../mockups/shared/img/slogan-floor-sm.jpg" style="object-position:50% 20%"></div>
    <div class="card c3"><img src="../../mockups/shared/img/zumba-class-sm.jpg"></div>
  </div>
</body></html>
